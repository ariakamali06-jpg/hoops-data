name: Update news feed

on:
  schedule:
    # هر ۶ ساعت اجرا می‌شود (زمان UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # دکمه Run در صفحه Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          HOOPS_PROXY: "" # در Actions فقط اتصال مستقیم استفاده می‌شود
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.name "hoops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news feed [skip ci]"
            git push
          fi
